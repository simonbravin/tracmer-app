name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Vercel NO comparte variables con GitHub Actions: son dos entornos distintos.
      # `prisma validate` y el `prisma generate` del postinstall solo necesitan que exista
      # una URL con formato válido; no abren conexión a ese host durante validate.
      # La base real sigue siendo la de Vercel / tu .env local en deploy y en dev.
      DATABASE_URL: "postgresql://ci_placeholder:ci_placeholder@127.0.0.1:5432/ci_placeholder?schema=public"
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: usa `packageManager` del package.json (pnpm@9.15.4).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # DATABASE_URL en la misma línea: asegura que exista aunque algo pise el env del job.
      - name: Install
        run: DATABASE_URL="postgresql://ci_placeholder:ci_placeholder@127.0.0.1:5432/ci_placeholder?schema=public" pnpm install --frozen-lockfile

      - name: Prisma schema
        run: DATABASE_URL="postgresql://ci_placeholder:ci_placeholder@127.0.0.1:5432/ci_placeholder?schema=public" pnpm run db:validate

      - name: TypeScript
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

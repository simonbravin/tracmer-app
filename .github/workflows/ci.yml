name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Misma cadena que en Vercel: GitHub → Settings → Secrets and variables → Actions → DATABASE_URL
      # (Prisma validate/generate resuelven el datasource; no commitees .env con credenciales.)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secret DATABASE_URL
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Falta el secret DATABASE_URL en GitHub (Settings → Secrets and variables → Actions). Usá la misma cadena que en Vercel/Neon. El .env local no se sube al runner; no hace falta commitearlo."
            exit 1
          fi

      # Sin `version`: usa `packageManager` del package.json (pnpm@9.15.4).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma schema
        run: pnpm run db:validate

      - name: TypeScript
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint
